name: Diagnóstico implantações do modelo

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp
      - name: Credenciais
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC" > ~/.clasprc.json
      - name: Listar implantações (IDs abreviados)
        env:
          MODELO: ${{ secrets.SCRIPT_ID_MODELO }}
        run: |
          mkdir p && cd p
          echo "{\"scriptId\":\"$MODELO\"}" > .clasp.json
          echo "== Implantações =="
          clasp deployments 2>&1 | sed -E 's/(AKfy[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+([A-Za-z0-9_-]{6})/\1…\2/g'
          echo "== Versões (últimas) =="
          clasp versions 2>&1 | tail -n 8
      - name: Projeto (planilha vinculada) e datas das versões
        env:
          MODELO: ${{ secrets.SCRIPT_ID_MODELO }}
        run: |
          F=~/.clasprc.json
          CID=$(jq -r '.oauth2ClientSettings.clientId // .tokens.default.client_id // empty' $F)
          CSE=$(jq -r '.oauth2ClientSettings.clientSecret // .tokens.default.client_secret // empty' $F)
          RT=$(jq -r '.token.refresh_token // .tokens.default.refresh_token // empty' $F)
          AT=$(curl -s https://oauth2.googleapis.com/token -d client_id=$CID -d client_secret=$CSE -d refresh_token=$RT -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          echo "== Projeto =="
          curl -s -H "Authorization: Bearer $AT" https://script.googleapis.com/v1/projects/$MODELO | jq '{title, parentId, updateTime}'
          echo "== Versões =="
          curl -s -H "Authorization: Bearer $AT" https://script.googleapis.com/v1/projects/$MODELO/versions | jq '.versions[]? | {versionNumber, createTime}'
          echo "== Implantações =="
          curl -s -H "Authorization: Bearer $AT" https://script.googleapis.com/v1/projects/$MODELO/deployments | jq '.deployments[]? | {v: .deploymentConfig.versionNumber, updateTime, id_fim: (.deploymentId[-6:]), web: [.entryPoints[]?.webApp.entryPointConfig]}'
      - name: Conteúdo atual e da versão 2 (marcadores)
        env:
          MODELO: ${{ secrets.SCRIPT_ID_MODELO }}
        run: |
          F=~/.clasprc.json
          CID=$(jq -r '.oauth2ClientSettings.clientId // .tokens.default.client_id // empty' $F)
          CSE=$(jq -r '.oauth2ClientSettings.clientSecret // .tokens.default.client_secret // empty' $F)
          RT=$(jq -r '.token.refresh_token // .tokens.default.refresh_token // empty' $F)
          AT=$(curl -s https://oauth2.googleapis.com/token -d client_id=$CID -d client_secret=$CSE -d refresh_token=$RT -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          for V in "" "?versionNumber=2"; do
            echo "== content $V =="
            curl -s -H "Authorization: Bearer $AT" "https://script.googleapis.com/v1/projects/$MODELO/content$V" > c.json
            jq -r '.files[] | "\(.name) \(.source|length)"' c.json
            for M in VERSAO_CODIGO avisoVersao reenviarSolicitacao cancelarFerias propsCache_ notificarSubstituto_; do
              printf "%s: " $M; jq -r '[.files[].source] | join(" ")' c.json | grep -c "$M" || true
            done
          done
