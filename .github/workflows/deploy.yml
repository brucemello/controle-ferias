name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proteção contra pasta vazia
        run: |
          if [ ! -f src/appsscript.json ]; then
            echo "src/appsscript.json não encontrado. Deploy cancelado para não apagar o projeto online."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @google/clasp

      - name: Credenciais do clasp
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC" > ~/.clasprc.json

      - name: Apontar para o projeto
        run: echo "{\"scriptId\":\"${{ secrets.SCRIPT_ID }}\",\"rootDir\":\"src\"}" > .clasp.json

      - name: Gerar URL do App da Web
        run: |
          echo "const URL_WEBAPP_APROVACAO = \"https://script.google.com/macros/s/${{ secrets.DEPLOYMENT_ID }}/exec\";" > src/ConfigDeploy.js
          echo "const VERSAO_CODIGO = \"${{ github.sha }}\";" >> src/ConfigDeploy.js

      - run: clasp push --force

      - run: clasp deploy -i "${{ secrets.DEPLOYMENT_ID }}" -d "Deploy ${{ github.sha }}"

      # Planilha modelo (opcional): recebe o mesmo código, sem implantação.
      # Ativa quando o secret SCRIPT_ID_MODELO existir.
      - name: Atualizar planilha modelo
        env:
          MODELO: ${{ secrets.SCRIPT_ID_MODELO }}
        run: |
          if [ -z "$MODELO" ]; then
            echo "Secret SCRIPT_ID_MODELO não configurado: modelo ignorado."
            exit 0
          fi
          echo "{\"scriptId\":\"$MODELO\",\"rootDir\":\"src\"}" > .clasp.json
          clasp push --force
          echo "Modelo atualizado."
